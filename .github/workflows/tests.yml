name: Filip Guard Tests

on:
  push:
    branches:
      - filip-guard-development
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up PHP for companion tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify PHP test runtime
        run: php --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: List test files
        run: ls -la test_*.py

      
        
        
        

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  real-wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: fg-disposable-ci-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, phar, iconv, ctype, tokenizer, mbstring
          coverage: none
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download verified disposable WordPress fixture
        run: python tests/real_wordpress/download.py "$RUNNER_TEMP/fg-wp-fixture"
      - name: Run real WordPress REST integration on MySQL
        env:
          FG_WP_CLI: ${{ runner.temp }}/fg-wp-fixture/wp-cli.phar
          FG_WP_SOURCE: ${{ runner.temp }}/fg-wp-fixture/wordpress
          FG_WP_DB_USER: root
          FG_WP_DB_PASSWORD: fg-disposable-ci-only
          FG_WP_DB_PORT: '3306'
        run: python tests/real_wordpress/run.py
