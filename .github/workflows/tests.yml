name: Filip Guard Tests

on:
  push:
    branches:
      - filip-guard-development
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up PHP for companion tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify PHP test runtime
        run: php --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: List test files
        run: ls -la test_*.py

      
        
        
        

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  real-wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: fg-disposable-ci-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, phar, iconv, ctype, tokenizer, mbstring
          coverage: none
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download verified disposable WordPress fixture
        run: python tests/real_wordpress/download.py "$RUNNER_TEMP/fg-wp-fixture"
      - name: Run real WordPress REST integration on MySQL
        env:
          FG_WP_CLI: ${{ runner.temp }}/fg-wp-fixture/wp-cli.phar
          FG_WP_SOURCE: ${{ runner.temp }}/fg-wp-fixture/wordpress
          FG_WP_DB_USER: root
          FG_WP_DB_PASSWORD: fg-disposable-ci-only
          FG_WP_DB_PORT: '3306'
          FG_UI_PROOF_PATH: ${{ runner.temp }}/filip-guard-ui-proof.json
        run: python tests/real_wordpress/run.py

      - name: Preserve sanitized integrated UI demonstration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filip-guard-integrated-ui-proof
          path: ${{ runner.temp }}/filip-guard-ui-proof.json
          if-no-files-found: ignore


  real-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned official MinIO source for isolated tests
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          path: .ci-minio
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache-dependency-path: .ci-minio/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and isolated SMTP test dependencies
        run: python -m pip install -r requirements.txt aiosmtpd==1.4.6
      - name: Build official security-fixed S3 test server
        working-directory: .ci-minio
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
        run: go build -trimpath -o "$RUNNER_TEMP/fg-minio" .
      - name: Verify encrypted S3 recovery, persistence and TLS SMTP delivery
        env:
          FG_MINIO_BINARY: ${{ runner.temp }}/fg-minio
        run: python tests/real_infrastructure/run.py
