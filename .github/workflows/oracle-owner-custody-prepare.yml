name: Oracle owner-interactive master custody preparation
on:
  push:
    branches: [filip-guard-development]
    paths: [deployment/oracle-owner-custody-request.json]
permissions:
  contents: read
concurrency:
  group: filip-guard-oracle-host-configuration
  cancel-in-progress: false
jobs:
  setup-existing-host:
    if: github.repository == 'Ciobanu87/filip-guard' && github.ref == 'refs/heads/filip-guard-development'
    environment: filip-guard-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install owner-interactive custody helper without generating a master
        env:
          FG_OCI_HOST_SETUP_AUTHORIZED: '1'
          FG_OCI_HOST: ${{ secrets.FG_OCI_HOST }}
          FG_OCI_HOST_ED25519_SHA256: ${{ secrets.FG_OCI_HOST_ED25519_SHA256 }}
          FG_OCI_SSH_PRIVATE_KEY: ${{ secrets.FG_OCI_SSH_PRIVATE_KEY }}
        run: python operations_oracle_owner_custody.py install-helper

  owner-local-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package owner-local recovery tool without any secret
        run: python deployment/build_owner_custody_tool.py
      - uses: actions/upload-artifact@v4
        with:
          name: filip-guard-owner-local-custody-tool
          path: |
            deployment/owner-custody.html
            deployment/OWNER_MASTER_CUSTODY.md
            recover_owner_master.py
          retention-days: 1
          if-no-files-found: error
