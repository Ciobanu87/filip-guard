name: Oracle existing identity read-only account access
on:
  push:
    branches: [filip-guard-development]
    paths: [deployment/oracle-account-access-request.json]
permissions:
  contents: read
concurrency:
  group: filip-guard-oracle-ssh-readonly
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'Ciobanu87/filip-guard' && github.ref == 'refs/heads/filip-guard-development'
    environment: filip-guard-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check existing OCI tooling and existing identity without installation or IAM changes
        env:
          FG_OCI_SSH_PROBE_AUTHORIZED: '1'
          FG_OCI_HOST: ${{ secrets.FG_OCI_HOST }}
          FG_OCI_HOST_ED25519_SHA256: ${{ secrets.FG_OCI_HOST_ED25519_SHA256 }}
          FG_OCI_SSH_PRIVATE_KEY: ${{ secrets.FG_OCI_SSH_PRIVATE_KEY }}
        run: python operations_oracle_account_access.py
