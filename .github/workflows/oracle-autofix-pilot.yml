name: Oracle AutoFix isolated pilot
on:
  push:
    branches: [filip-guard-development]
    paths: [deployment/oracle-autofix-pilot-request.json]
permissions:
  contents: read
concurrency:
  group: filip-guard-oracle-host-configuration
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'Ciobanu87/filip-guard' && github.ref == 'refs/heads/filip-guard-development'
    environment: filip-guard-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only allocation, capacity and existing dependency checks
        id: admission
        env:
          FG_OCI_SSH_PROBE_AUTHORIZED: '1'
          FG_OCI_HOST: ${{ secrets.FG_OCI_HOST }}
          FG_OCI_HOST_ED25519_SHA256: ${{ secrets.FG_OCI_HOST_ED25519_SHA256 }}
          FG_OCI_SSH_PRIVATE_KEY: ${{ secrets.FG_OCI_SSH_PRIVATE_KEY }}
        run: python operations_oracle_autofix_pilot.py
      - name: Run existing native synthetic tests with network disabled
        if: steps.admission.outputs.native_eligible == 'true'
        env:
          FG_OCI_HOST_SETUP_AUTHORIZED: '1'
          FG_OCI_HOST: ${{ secrets.FG_OCI_HOST }}
          FG_OCI_HOST_ED25519_SHA256: ${{ secrets.FG_OCI_HOST_ED25519_SHA256 }}
          FG_OCI_SSH_PRIVATE_KEY: ${{ secrets.FG_OCI_SSH_PRIVATE_KEY }}
        run: python operations_oracle_autofix_native.py
